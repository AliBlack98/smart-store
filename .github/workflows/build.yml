name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare
        run: |
          mkdir -p www
          echo '<!DOCTYPE html><html><body>loading</body></html>' > www/index.html
          cat > package.json <<'EOT'
          {
            "name": "smart-store",
            "version": "1.0.0",
            "dependencies": {
              "@capacitor/core": "^7.4.0",
              "@capacitor/android": "^7.4.0",
              "@capacitor/cli": "^7.4.0",
              "@capacitor/keyboard": "^7.0.0"
            }
          }
          EOT
          cat > capacitor.config.json <<'EOT'
          {
            "appId": "com.aamsmartstore.app",
            "appName": "المحاسب الذكي",
            "webDir": "www",
            "server": {
              "url": "https://aliblack98.github.io/smart-store/",
              "androidScheme": "https"
            },
            "android": {
              "adjustMarginsForEdgeToEdge": "auto"
            }
          }
          EOT
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Set version
        run: |
          cd android/app
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" build.gradle
      - name: Build and sign
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cd android && chmod +x gradlew
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "Signing with the fixed key"
            ./gradlew assembleRelease
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
            UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -1)
            $BT/zipalign -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
            $BT/apksigner sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS --out "$GITHUB_WORKSPACE/smart-store.apk" "$RUNNER_TEMP/aligned.apk"
            $BT/apksigner verify --print-certs "$GITHUB_WORKSPACE/smart-store.apk" | head -3
          else
            echo "No signing secrets found, building a debug APK"
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/smart-store.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: smart-store.apk
