name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare
        run: |
          mkdir -p www
          echo '<!DOCTYPE html><html><body>loading</body></html>' > www/index.html
          cat > package.json <<'EOF'
          {
            "name": "smart-store",
            "version": "1.0.0",
            "dependencies": {
              "@capacitor/core": "^7.0.0",
              "@capacitor/android": "^7.0.0",
              "@capacitor/cli": "^7.0.0"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.aamsmartstore.app",
            "appName": "المحاسب الذكي",
            "webDir": "www",
            "server": {
              "url": "https://aliblack98.github.io/smart-store/",
              "androidScheme": "https"
            }
          }
          EOF
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
